<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Header compositions · Barbajoe CSS specimen</title>
		<link rel="stylesheet" href="../lib/barbajoe.css" />
		<link rel="stylesheet" href="./specimen.css" />
	</head>
	<body>
		<div class="app-shell">
			<header class="site-header">
				<a class="skip-link" href="#main-content">Skip to main content</a>
				<strong>Header compositions</strong>
				<nav aria-label="Specimen pages">
					<ul class="site-header-links">
						<li><a href="./index.html">Catalog</a></li>
						<li class="active"><a href="./headers.html">Headers</a></li>
					</ul>
				</nav>
			</header>

			<main id="main-content">
				<h1>Supported site-header compositions</h1>

				<section class="specimen-section" aria-labelledby="combined-header">
					<h2 id="combined-header">Brand and navigation</h2>
					<header class="site-header">
						<strong>Barbajoe</strong>
						<nav aria-label="Combined example">
							<ul class="site-header-links">
								<li class="active"><a href="#current">Current</a></li>
								<li><a href="#available">Available</a></li>
								<li><a href="#disabled" aria-disabled="true">Disabled</a></li>
							</ul>
						</nav>
					</header>
				</section>

				<section class="specimen-section" aria-labelledby="brand-header">
					<h2 id="brand-header">Brand only</h2>
					<header class="site-header">
						<strong>Barbajoe</strong>
					</header>
				</section>

				<section class="specimen-section" aria-labelledby="navigation-header">
					<h2 id="navigation-header">Navigation only</h2>
					<header class="site-header">
						<nav aria-label="Navigation-only example">
							<ul class="site-header-links">
								<li class="active"><a href="#first">First</a></li>
								<li><a href="#second">Second</a></li>
							</ul>
						</nav>
					</header>
				</section>
			</main>

			<footer><a href="./index.html">Return to the component catalog</a></footer>
		</div>
	</body>
</html>
