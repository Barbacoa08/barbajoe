name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      minimum_tier:
        description: Minimum validation tier (cannot reduce the version-selected tier)
        type: choice
        options: [none, light, heavy]
        default: heavy

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'css-staged-release' || format('ci-{0}', github.run_id) }}
  # Preserve pending main releases; only superseded PR runs may be replaced.
  queue: max

jobs:
  check:
    # Preserve the repository's required check identity for every tier.
    name: Lint and build CSS library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: validation-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      release: ${{ steps.tier.outputs.release }}
      before: ${{ steps.tier.outputs.before }}
      after: ${{ steps.tier.outputs.after }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.1
          cache: true
          install: false
      - name: Select validation tier
        id: tier
        run: node .github/scripts/css-ci-event.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.lockfile=true
      - name: Lint CSS library
        run: pnpm lint
      - name: Build CSS library and documentation once
        run: pnpm build:specimen
      - name: Test release helpers and suite membership
        if: steps.tier.outputs.tier != 'none'
        env:
          BARBA_TEST_USE_EXISTING_BUILD: '1'
        run: |
          pnpm test:release
          mkdir -p .projects/ci
          pnpm exec playwright test --list --grep @light --reporter=json > .projects/ci/light.json
          pnpm exec playwright test --list --reporter=json > .projects/ci/heavy.json
          node .github/scripts/check-browser-inventory.mjs .projects/ci/light.json .projects/ci/heavy.json
      - name: Install test browsers and system dependencies
        if: steps.tier.outputs.tier != 'none'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run selected browser suite
        id: browser
        if: steps.tier.outputs.tier != 'none'
        env:
          BARBA_TEST_USE_EXISTING_BUILD: '1'
          CI_TIER: ${{ steps.tier.outputs.tier }}
        run: |
          case "$CI_TIER" in
            light) pnpm test:browser:light ;;
            heavy) pnpm test:browser:heavy ;;
            *) exit 1 ;;
          esac
      - name: Upload browser report
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' && steps.browser.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-review-${{ steps.tier.outputs.tier }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

  gate:
    name: Check CSS version increase
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.version.outputs.stage }}
      previous: ${{ steps.version.outputs.previous }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.after }}
          fetch-depth: 0
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.1
          cache: false
          install: false
      - name: Compare current, previous, and published versions
        id: version
        env:
          BEFORE_SHA: ${{ needs.check.outputs.before }}
        run: |
          previous=$(git show "${BEFORE_SHA}:src/packages/css-lib/package.json" | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => console.log(JSON.parse(data).version))')
          current=$(node -p "require('./src/packages/css-lib/package.json').version")
          published=$(pnpm view @barbajoe/css-lib dist-tags.latest)
          node .github/scripts/css-release-gate.mjs "$previous" "$current" "$published"

  stage:
    name: Validate and stage CSS package
    needs: [check, gate]
    if: needs.gate.outputs.stage == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.after }}
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.1
          cache: false
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.lockfile=true
      - name: Build and inspect validated package
        run: pnpm build
      - name: Inspect package contents
        env:
          CURRENT_VERSION: ${{ needs.gate.outputs.current }}
        run: pnpm -C src/packages/css-lib pack --dry-run --json --ignore-scripts | node .github/scripts/css-package-check.mjs "$CURRENT_VERSION"
      - name: Stage package for npm 2FA approval
        run: pnpm -C src/packages/css-lib stage publish --ignore-scripts --no-git-checks --access public --tag latest

  remind:
    name: Assign npm approval reminder
    needs: [check, gate, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.after }}
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.1
          cache: false
          install: false
      - name: Create or reuse version reminder
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_VERSION: ${{ needs.gate.outputs.previous }}
          CURRENT_VERSION: ${{ needs.gate.outputs.current }}
        run: node .github/scripts/css-stage-reminder.mjs
