name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and build CSS library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.lockfile=true
      - name: Lint CSS library
        run: pnpm lint
      - name: Build CSS library
        run: pnpm build
